[package]
name = "nexus"
version = "0.1.0"
description = "Floating desktop AI assistant (thin client)"
authors = ["NEXUS"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "nexus_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }

tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-positioner = "2"

tokio = { version = "1", features = ["rt", "sync", "macros", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"
once_cell = "1"
anyhow = "1"
walkdir = "2.5"
ignore = "0.4"
rayon = "1.10"
petgraph = "0.6"
# Regex for intent parser patterns
regex = "1"

# Audio capture (16k mono) for wake word detection
cpal = "0.15"
# sherpa-onnx: on-device keyword spotting + speaker verification (Apache 2.0)
# ONLY compiled when the `wakeword-sherpa` feature is enabled.
# The default wake engine is openWakeWord (wakeword-oww / tract-onnx).
# sherpa-onnx pulls in a large C++ ONNX Runtime build step — gating it
# behind a feature flag shaves ~5-8 min off cold builds for the default config.
# tract-onnx: pure-Rust ONNX inference (no native ONNX Runtime dependency)
# Used for openWakeWord KWS pipeline: melspectrogram → embedding → classifier
tract-onnx = "0.23"
circular-buffer = "1.2"
# HTTP client for diagnostics
reqwest = { version = "0.12", features = ["json", "multipart"] }
chrono = { version = "0.4.45", features = ["serde"] }

# TTS engines:
# - edge-tts-rust: Microsoft Edge Neural TTS (cloud, free, no API key, 400+ voices)
#   Primary TTS — 0 MB local RAM, ~200ms latency, broadcast-quality voices.
# - piper-rs: Piper VITS ONNX (local fallback, 80 MB RAM, 60 MB model, 40ms latency)
#   Fallback when internet is unavailable.
# - rodio: audio playback (shared by both engines)
edge-tts-rust = "0.1"
piper-rs = "0.2"
rodio = "0.19"

# Cross-platform app/URL launching (open::that, open::with)
open = "5"

# Native window blur/vibrancy for the sidebar (acrylic on Win, vibrancy on Mac)
window-vibrancy = "0.8"

# Access the native HWND from a tauri::WebviewWindow (for DWM corner rounding)
raw-window-handle = "0.6"

# Platform-agnostic user dirs (for app_registry disk cache path)
dirs-next = "2"

# Process enumeration — check if an app is already running (3-tier resolution)
sysinfo = "0.32"

# Image decode/encode + fast box blur — used for the sidebar's "fake blur"
# backdrop (screen capture behind the window, blurred, shown as CSS background).
# Native OS blur (Acrylic/Mica) can't render translucently on our non-activating
# sidebar window (see AGENTS.md), so this replaces it.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"

# AST-aware symbol extraction for the Architecture Mapper (tree-sitter)
tree-sitter = "0.25"
tree-sitter-rust = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-go = "0.23"
# SHA-256 for content hashing in symbol extraction
sha2 = "0.10"

# GitHub API client for the GitHub sub-command system (Phase 2A).
# octocrab provides a typed semantic API + low-level HTTP fallback.
# Used by github_cmd.rs to execute structured GitHubCommand operations.
octocrab = "0.42"
async-trait = "0.1"

# Live mode: cross-platform keyboard/mouse simulation + clipboard for paste-text.
# enigo: used by live/commands/keyboard.rs to type text and press keys.
# arboard: used by live/commands/keyboard.rs for clipboard-paste (avoids
# autocomplete corruption when typing into WhatsApp/search boxes).
enigo = "0.5"
arboard = "3.4"


# Windows-specific: EnumWindows + SetForegroundWindow + ShellExecuteW
[target.'cfg(windows)'.dependencies]
windows = { version = "0.36", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_HiDpi",
    "Win32_System_Threading",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_ProcessStatus",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Graphics_Gdi",
] }
# Registry access for App Paths + Uninstall keys (app discovery)
winreg = "0.55"
# UI Automation for active browser URL detection (Architecture Mapper)
uiautomation = "0.25"
# WebView2 COM bindings for the PermissionRequested handler (auto-approve mic
# permission so the prompt never re-appears). Version pinned to match wry's.
webview2-com = "0.38"
windows-core = "0.61"

# Linux-specific: D-Bus / MPRIS media control & native notifications via zbus
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"

[features]
default = ["wakeword-oww"]
# REQUIRED FOR PRODUCTION BUILDS — DO NOT REMOVE.
# Tauri decides whether to load `frontendDist` (bundled assets, served over the
# custom `tauri://` protocol) or `devUrl` (http://localhost:5173) purely from
# this feature flag:
#
#   tauri-macros/src/context.rs:  dev: cfg!(not(feature = "custom-protocol"))
#
# Without it, EVERY build — including `cargo build --release` — embeds the dev
# server URL and the packaged app shows "localhost refused to connect"
# (ERR_CONNECTION_REFUSED) because no Vite server is running.
#
# `cargo tauri build` passes `--features custom-protocol` automatically.
# For a plain cargo build, pass it explicitly:
#   cargo build --release --features custom-protocol
#
# It is intentionally NOT in `default` — `tauri dev` needs it OFF so the Vite
# dev server and hot reload keep working.
custom-protocol = ["tauri/custom-protocol"]
wakeword-oww = []                # openWakeWord via tract-onnx (new, default)
wakeword-sherpa = []             # Sherpa-ONNX wake word + speaker verification (optional, not in default build)
mock-wake = []                   # CI: skip native lib, emit fake wake on hotkey only
# Admin-only brain system (Qwen 0.5B + pronunciation learning + auto-train).
# When enabled, brain_client + brain_monitor modules are compiled in.
# When disabled (default), all brain code is compiled out — normal users
# can never run the brain even if they find the files.
# Build with: cargo build --features admin-brain
admin-brain = []

[profile.dev]
opt-level = 0
debug = true
incremental = true   # fast recompile on small changes

[profile.release]
# "s" = optimize for binary size (10-30% faster to compile than "z",
# almost identical output size in practice for this codebase).
opt-level = "s"
# thin LTO: still removes dead code and does cross-crate inlining,
# but parallelises the work. ~2x faster link step vs fat LTO.
lto = "thin"
# 4 parallel codegen units — allows LLVM to work in parallel.
# codegen-units=1 forces serial codegen, which was the main bottleneck.
codegen-units = 4
strip = true
panic = "abort"

# [profile.dist] — use this ONLY when building the final installer
# (pwsh ./scripts/build.ps1 already passes the right flags).
# Keeps fat LTO + single codegen unit for the smallest possible binary.
[profile.dist]
inherits = "release"
lto = true
codegen-units = 1
opt-level = "z"
strip = true
panic = "abort"

[target.'cfg(not(target_os = "linux"))'.dependencies]
tauri-plugin-global-shortcut = "2"
