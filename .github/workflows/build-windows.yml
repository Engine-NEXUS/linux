name: Build Windows Executable Installer

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows NSIS Installer (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 & Cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install LLVM & Set LIBCLANG_PATH
        run: |
          if (-not (Test-Path "C:\Program Files\LLVM\bin\libclang.dll")) {
            choco install llvm -y
          }
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      - name: Cache Rust Cargo Dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Fast Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Frontend Bundle
        working-directory: ./frontend
        run: npm run build

      - name: Build Windows Executable (.exe) Installer via Tauri
        env:
          NEXUS_SERVER_URL: https://nexus-worker.chitkullakshya.workers.dev
          CARGO_INCREMENTAL: 0
        # Build NSIS installer bundle
        run: npx --yes @tauri-apps/cli build --bundles nsis --features custom-protocol

      - name: Upload Windows Setup Executable (.exe) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Windows-Installer-exe
          path: src-tauri/target/release/bundle/nsis/*.exe
