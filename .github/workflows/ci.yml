name: ci

on:
  pull_request:
    branches: ["**"]
  push:
    branches: ["**"]

jobs:
  frontend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build frontend
        run: npm run build

      - name: Run frontend tests
        run: npm test

  rust-check-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libssl-dev pkg-config

      - name: Cargo check (default)
        working-directory: src-tauri
        run: cargo check

      - name: Cargo check (mock-wake)
        working-directory: src-tauri
        run: cargo check --features mock-wake

      - name: Cargo test (lib)
        working-directory: src-tauri
        run: cargo test --lib -- --test-threads=1

  python-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install NLU server deps
        working-directory: server/nlu
        run: pip install -r requirements.txt

      - name: Check NLU server parses
        working-directory: server
        run: python -c "import ast; ast.parse(open('nlu_server.py').read()); print('NLU server parses OK')"

      - name: Check STT server parses
        working-directory: server
        run: python -c "import ast; ast.parse(open('stt_server.py').read()); print('STT server parses OK')"

      - name: Check NLU train script parses
        working-directory: server/nlu
        run: python -c "import ast; ast.parse(open('train.py').read()); print('train.py parses OK')"

      # NOTE (2026-09-27): the legacy sidecar (server/sidecar/) and n8n
      # blueprints (server/n8n/) were removed with the serverless migration
      # (Worker + lazy Python sidecars). Their parse/validate steps are
      # intentionally gone — do not re-add without restoring the dirs.

      - name: Validate NLU Data Foundation
        run: python server/nlu/data_foundation.py validate
