<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEXUS Orb Studio</title>
  <style>
    :root {
      --bg: rgba(10, 11, 16, 0.88);
      --border: rgba(255, 255, 255, 0.08);
      --card: rgba(255, 255, 255, 0.03);
      --accent: #a855f7;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      user-select: none;
    }
    .studio-shell {
      width: 100%;
      height: 100%;
      background: var(--bg);
      backdrop-filter: blur(40px) saturate(180%);
      -webkit-backdrop-filter: blur(40px) saturate(180%);
      border: 1px solid var(--border);
      border-radius: 20px;
      display: flex;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
      position: relative;
    }
    /* Drag header */
    .drag-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 36px;
      -webkit-app-region: drag;
      z-index: 10;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding: 0 14px;
    }
    .close-btn {
      -webkit-app-region: no-drag;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      color: var(--text-muted);
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
      transition: all 0.15s;
    }
    .close-btn:hover {
      background: rgba(239, 68, 68, 0.8);
      color: #fff;
      border-color: transparent;
    }

    /* Left Control Column (300px) */
    .control-pane {
      width: 310px;
      height: 100%;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 42px 20px 20px;
      z-index: 1;
    }
    .pane-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 14px;
    }
    /* Tab Segmented Control */
    .state-tabs {
      display: flex;
      background: rgba(0, 0, 0, 0.3);
      padding: 3px;
      border-radius: 10px;
      border: 1px solid var(--border);
      margin-bottom: 16px;
    }
    .state-tab {
      flex: 1;
      padding: 7px 0;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s;
      text-align: center;
    }
    .state-tab.active {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 2px 8px rgba(168, 85, 247, 0.4);
    }

    /* Number Grid: 1..12 */
    .options-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      overflow-y: auto;
      flex: 1;
      padding-right: 4px;
      margin-bottom: 16px;
    }
    .options-grid::-webkit-scrollbar {
      width: 4px;
    }
    .options-grid::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.1);
      border-radius: 4px;
    }
    .opt-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      height: 52px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .opt-card:hover {
      background: rgba(255, 255, 255, 0.07);
      border-color: rgba(168, 85, 247, 0.4);
    }
    .opt-card.selected {
      background: rgba(168, 85, 247, 0.18);
      border-color: var(--accent);
      box-shadow: 0 0 14px rgba(168, 85, 247, 0.35);
    }
    .opt-num {
      font-size: 15px;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.5px;
    }
    .opt-card.selected .opt-num {
      color: #c084fc;
    }
    .opt-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--text-muted);
      margin-top: 3px;
    }
    .opt-card.selected .opt-dot {
      background: #c084fc;
      box-shadow: 0 0 6px #c084fc;
    }

    /* Summary bar & save button */
    .save-section {
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }
    .save-btn {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: none;
      background: var(--accent);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.3px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s;
      box-shadow: 0 4px 16px rgba(168, 85, 247, 0.35);
    }
    .save-btn:hover {
      filter: brightness(1.1);
      box-shadow: 0 6px 20px rgba(168, 85, 247, 0.5);
    }

    /* Right Preview Stage (490px) */
    .stage-pane {
      flex: 1;
      height: 100%;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, rgba(30, 22, 45, 0.5) 0%, transparent 70%);
      padding: 42px 24px 20px;
    }
    .canvas-wrapper {
      width: 380px;
      height: 380px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .stage-state-tag {
      position: absolute;
      top: 14px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #c084fc;
      background: rgba(0, 0, 0, 0.4);
      padding: 4px 12px;
      border-radius: 100px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .sim-bar {
      margin-top: 18px;
      width: 320px;
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(0,0,0,0.3);
      padding: 8px 16px;
      border-radius: 100px;
      border: 1px solid var(--border);
    }
    .sim-bar input[type="range"] {
      flex: 1;
      accent-color: var(--accent);
    }
    .sim-label {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="studio-shell">
    <div class="drag-bar">
      <button class="close-btn" onclick="closeStudio()">✕</button>
    </div>

    <!-- Left Controls -->
    <div class="control-pane">
      <div class="pane-title">Configure State Morphology</div>
      <div class="state-tabs">
        <button class="state-tab active" onclick="switchTab('thinking')">Thinking</button>
        <button class="state-tab" onclick="switchTab('speaking')">Speaking</button>
        <button class="state-tab" onclick="switchTab('listening')">Listening</button>
        <button class="state-tab" onclick="switchTab('wakeup')">Wakeup</button>
      </div>

      <!-- Option Cards: No names, just clean numbered options -->
      <div class="options-grid" id="optionsGrid"></div>

      <div class="save-section">
        <button class="save-btn" onclick="saveConfiguration()">
          ✓ Save Configuration
        </button>
      </div>
    </div>

    <!-- Right Live Animation Stage -->
    <div class="stage-pane">
      <div class="stage-state-tag" id="stageTag">PREVIEW: THINKING (OPTION #6)</div>
      <div class="canvas-wrapper">
        <canvas id="previewCanvas"></canvas>
      </div>
      <div class="sim-bar">
        <span class="sim-label">Pulse</span>
        <input type="range" id="audioSlider" min="0" max="1" step="0.01" value="0.30" oninput="updateAudio(this.value)">
      </div>
    </div>
  </div>

  <script type="module">
    import { invoke } from "@tauri-apps/api/core";

    window.closeStudio = () => {
      invoke("close_orb_studio_window").catch(() => window.close());
    };

    // Current selections (Defaults: Think #6, Speak #2, Listen #1, Wakeup #1)
    const selection = {
      thinking: 6,
      speaking: 2,
      listening: 1,
      wakeup: 1
    };

    // Load saved settings if present
    try {
      const saved = localStorage.getItem('nexus_orb_morphology');
      if (saved) {
        Object.assign(selection, JSON.parse(saved));
      }
      const savedWakeup = localStorage.getItem('nexus:orb_wakeup_mode');
      if (savedWakeup) {
        selection.wakeup = Number(savedWakeup);
      }
    } catch (_) {}

    invoke("get_settings").then(s => {
      if (s) {
        if (s.orbThinkMode) selection.thinking = s.orbThinkMode;
        if (s.orbSpeakMode) selection.speaking = s.orbSpeakMode;
        if (s.orbListenMode) selection.listening = s.orbListenMode;
        if (s.orbWakeupMode) selection.wakeup = s.orbWakeupMode;
        renderGrid();
        updateTag();
      }
    }).catch(() => {});

    let currentTab = 'thinking';
    let audioVal = 0.30;

    window.switchTab = (tab) => {
      currentTab = tab;
      document.querySelectorAll('.state-tab').forEach(b => {
        b.classList.toggle('active', b.innerText.toLowerCase() === tab);
      });
      renderGrid();
      updateTag();
    };

    const WAKEUP_NAMES = {
      1: "1. Elastic Thread",
      2: "2. Bowstring Pluck",
      3: "3. Liquid Meniscus",
      4: "4. Horizon Split",
      5: "5. Harmonic Ripple"
    };

    function renderGrid() {
      const grid = document.getElementById('optionsGrid');
      grid.innerHTML = '';
      const maxOpts = currentTab === 'wakeup' ? 5 : 12;
      for (let i = 1; i <= maxOpts; i++) {
        const card = document.createElement('div');
        const isSel = selection[currentTab] === i;
        card.className = `opt-card ${isSel ? 'selected' : ''}`;
        card.innerHTML = `
          <span class="opt-num">#${i}</span>
          <span class="opt-dot"></span>
        `;
        card.onclick = () => {
          selection[currentTab] = i;
          renderGrid();
          updateTag();
          if (currentTab === 'wakeup') {
            invoke("test_wake_orb").catch(() => {});
          }
        };
        grid.appendChild(card);
      }
    }
    renderGrid();

    function updateTag() {
      const tag = document.getElementById('stageTag');
      if (currentTab === 'wakeup') {
        tag.innerText = `PREVIEW: WAKEUP (${WAKEUP_NAMES[selection.wakeup] || 'OPTION #' + selection.wakeup})`;
      } else {
        tag.innerText = `PREVIEW: ${currentTab.toUpperCase()} (OPTION #${selection[currentTab]})`;
      }
    }

    window.updateAudio = (v) => {
      audioVal = parseFloat(v);
    };

    window.saveConfiguration = async () => {
      try {
        localStorage.setItem('nexus_orb_morphology', JSON.stringify(selection));
        if (selection.wakeup) {
          localStorage.setItem('nexus:orb_wakeup_mode', String(selection.wakeup));
        }
        window.dispatchEvent(new CustomEvent('nexus:orb_morphology', { detail: selection }));
        try {
          await invoke("set_orb_morphology", {
            think: selection.thinking,
            speak: selection.speaking,
            listen: selection.listening
          });
          if (selection.wakeup) {
            await invoke("set_orb_capsule_style", {
              style: "pebble",
              mode: selection.wakeup,
              genesis: 2
            });
          }
        } catch (_) {}
        alert(`Saved successfully!\n\nThinking: Option #${selection.thinking}\nSpeaking: Option #${selection.speaking}\nListening: Option #${selection.listening}\nWakeup: Option #${selection.wakeup}`);
        window.closeStudio();
      } catch (err) {
        alert("Saved settings: " + err);
        window.closeStudio();
      }
    };

    // WebGL Canvas Runner
    const canvas = document.getElementById('previewCanvas');
    const gl = canvas.getContext('webgl');
    const count = 4200;

    const vsSource = `
      precision highp float;
      attribute vec4 a_pos;
      uniform float u_time;
      uniform int u_tab;
      uniform int u_opt;
      uniform float u_audio;
      varying float v_depth;

      #define PI 3.14159265359

      vec3 turn(vec3 p, float a) {
        float c = cos(a), s = sin(a);
        return vec3(p.x*c + p.z*s, p.y, -p.x*s + p.z*c);
      }
      vec3 rotateX(vec3 p, float a) {
        float c = cos(a), s = sin(a);
        return vec3(p.x, p.y*c - p.z*s, p.y*s + p.z*c);
      }
      vec3 rotateY(vec3 p, float a) {
        float c = cos(a), s = sin(a);
        return vec3(p.x*c + p.z*s, p.y, -p.x*s + p.z*c);
      }
      vec3 rotateZ(vec3 p, float a) {
        float c = cos(a), s = sin(a);
        return vec3(p.x*c - p.y*s, p.x*s + p.y*c, p.z);
      }
      float hash(vec3 p) {
        p = fract(p*0.3183099+0.1);
        p *= 17.0;
        return fract(p.x*p.y*p.z*(p.x+p.y+p.z));
      }
      float noise(vec3 x) {
        vec3 p = floor(x);
        vec3 w = fract(x);
        vec3 u = w*w*(3.0-2.0*w);
        float n = p.x + p.y*157.0 + 113.0*p.z;
        return mix(mix(mix(hash(p+vec3(0,0,0)),hash(p+vec3(1,0,0)),u.x),
                       mix(hash(p+vec3(0,1,0)),hash(p+vec3(1,1,0)),u.x),u.y),
                   mix(mix(hash(p+vec3(0,0,1)),hash(p+vec3(1,0,1)),u.x),
                       mix(hash(p+vec3(0,1,1)),hash(p+vec3(1,1,1)),u.x),u.y),u.z);
      }

      void main() {
        vec3 n = a_pos.xyz;
        float seed = a_pos.w;
        float t = u_time;
        vec3 p = n;

        if (u_tab == 0) {
          // THINKING PREVIEW (u_opt: 1..12)
          if (u_opt == 1) {
            // Torus Knot
            float ku = seed * 2.0 * PI;
            float knotR = 0.88 * (1.0 + 0.38*cos(3.0*ku + t*0.40));
            vec3 knotC = vec3(knotR * cos(2.0*ku + t*0.26), knotR * sin(2.0*ku + t*0.26), -0.54 * sin(3.0*ku + t*0.40));
            p = turn(knotC + n*0.08, t*0.4);
          } else if (u_opt == 2) {
            // Neural Starburst
            float sId = floor(seed * 64.0);
            float sAlong = fract(seed * 64.0);
            float sy = 1.0 - 2.0*(sId + 0.5)/64.0;
            float sr = sqrt(max(0.0, 1.0 - sy*sy));
            float sang = sId * 2.399963;
            vec3 sDir = vec3(sr*cos(sang), sy, sr*sin(sang));
            float reach = pow(sAlong, 1.6);
            p = turn(sDir * reach * 1.85 + n*0.08, t*0.35);
          } else if (u_opt == 3) {
            // Mobius Infinity
            float u = seed * 4.0 * PI;
            float scale = 1.25 / (1.0 + sin(u*0.5)*sin(u*0.5));
            vec3 infC = vec3(scale * cos(u*0.5), scale * sin(u*0.5) * cos(u*0.5), 0.35 * sin(u + t*0.8));
            p = turn(rotateZ(infC + n*0.08, 0.3*sin(t*0.5)), t*0.45);
          } else if (u_opt == 4) {
            // Quantum Gyro
            float ring = floor(seed * 3.0);
            float a = fract(seed * 3.0) * 2.0 * PI;
            vec3 rP = vec3(cos(a), sin(a), (fract(seed*123.0)-0.5)*0.10);
            if (ring == 0.0) rP = rotateX(rP, t*1.2);
            if (ring == 1.0) rP = rotateY(rP, t*1.5);
            if (ring == 2.0) rP = rotateZ(rP, t*0.9);
            p = turn(rP * 1.15, t*0.2);
          } else if (u_opt == 5) {
            // Accretion Vortex
            float prog = fract(seed * 3.0);
            float sR = pow(prog, 0.65) * 1.55;
            float sA = prog * 6.28 * 2.0 + floor(seed*3.0)*(2.0*PI/3.0) - t*1.6;
            p = turn(rotateX(vec3(sR*cos(sA), sR*sin(sA), (prog-0.5)*0.45*cos(sA)), 0.5), t*0.3);
          } else if (u_opt == 6) {
            // Trefoil Celtic Cage (User choice!)
            float strand = floor(seed * 3.0);
            float ang = fract(seed * 3.0) * 2.0 * PI;
            float phase = strand * (2.0*PI/3.0);
            float R = 0.95 + 0.15*cos(3.0*ang + t*1.2);
            vec3 ringPos = vec3(R*cos(ang + t*0.5), R*sin(ang + t*0.5), 0.35*sin(2.0*ang + phase));
            if (strand == 1.0) ringPos = rotateX(ringPos, 1.05);
            if (strand == 2.0) ringPos = rotateZ(ringPos, 1.05);
            p = turn(ringPos + n*0.06, t*0.35);
          } else if (u_opt == 7) {
            // DNA Helix
            float strand = floor(seed * 2.0);
            float hZ = (fract(seed * 2.0) - 0.5) * 2.4;
            float hAng = hZ * 3.5 + t*1.5 + strand*PI;
            p = turn(rotateX(vec3(0.65*cos(hAng), hZ, 0.65*sin(hAng)), 0.4), t*0.35);
          } else if (u_opt == 8) {
            // 4D Tesseract
            float vId = floor(seed * 16.0);
            float x4 = mod(vId, 2.0)*2.0 - 1.0;
            float y4 = mod(floor(vId/2.0), 2.0)*2.0 - 1.0;
            float z4 = mod(floor(vId/4.0), 2.0)*2.0 - 1.0;
            float w4 = mod(floor(vId/8.0), 2.0)*2.0 - 1.0;
            float ang4 = t * 0.8;
            float rx = x4*cos(ang4) - w4*sin(ang4);
            p = turn(vec3(rx, y4, z4)*0.6 + n*0.08, t*0.3);
          } else if (u_opt == 9) {
            // Hydro Jellyfish
            float isBell = step(0.35, seed);
            vec3 bellP = vec3(n.x * 1.2, abs(n.y)*0.8, n.z * 1.2);
            vec3 tentP = vec3(n.x*0.4, -abs(n.y)*1.4 - 0.2, n.z*0.4);
            p = turn(mix(tentP, bellP, isBell), t*0.25);
          } else if (u_opt == 10) {
            // Magnetic Dynamo
            float theta = acos(clamp(n.y, -1.0, 1.0));
            float magR = 1.25 * sin(theta)*sin(theta);
            p = turn(vec3(magR*cos(seed*6.28 + t*0.8), n.y*1.2, magR*sin(seed*6.28 + t*0.8)), t*0.3);
          } else if (u_opt == 11) {
            // Geodesic Crystal
            vec3 fN = normalize(floor(n * 2.5 + 0.5));
            p = turn(rotateZ(fN * 0.9 + n*0.1, t*0.4), t*0.3);
          } else {
            // Solar Nebula
            float isRing = step(0.30, seed);
            float rRad = 0.8 + fract(seed*7.0)*0.8;
            float rAng = seed*20.0 + t*0.7;
            vec3 ringP = rotateX(vec3(rRad*cos(rAng), 0.0, rRad*sin(rAng)), 0.45);
            p = turn(mix(n*0.45, ringP, isRing), t*0.25);
          }
        } else if (u_tab == 1) {
          // SPEAKING PREVIEW
          float fluidN = noise(n*1.2 + vec3(t*0.3, -t*0.2, t*0.15));
          if (u_opt == 2) {
            // Option #2 Blossom (User choice)
            float bloom = sin(length(n.xy)*6.0 - t*3.0) * 0.24 * u_audio;
            p = turn(n * (1.1 + 0.15*fluidN + bloom), t*0.18);
          } else {
            float sag = -0.12*clamp(-n.y, 0.0, 1.0);
            p = turn(n * (1.0 + 0.2*fluidN + u_audio*0.35 + sag), t*0.2);
          }
        } else {
          // LISTENING PREVIEW
          p = turn(n, t*0.2) * (0.95 - u_audio*0.18*sin(seed*20.0 + t*8.0));
        }

        float depth = clamp((p.z + 1.5) / 3.0, 0.0, 1.0);
        v_depth = depth;
        gl_Position = vec4(p.xy * 0.72, 0.0, 1.0);
        gl_PointSize = max(1.6, 2.4 + 1.6*depth + u_audio*2.5);
      }
    `;

    const fsSource = `
      precision mediump float;
      varying float v_depth;
      void main() {
        float d = length(gl_PointCoord - 0.5) * 2.0;
        if (d > 1.0) discard;
        float a = 1.0 - smoothstep(0.15, 1.0, d);
        gl_FragColor = vec4(1.0, 1.0, 1.0, a * (0.6 + 0.4*v_depth));
      }
    `;

    const vs = gl.createShader(gl.VERTEX_SHADER);
    gl.shaderSource(vs, vsSource);
    gl.compileShader(vs);

    const fs = gl.createShader(gl.FRAGMENT_SHADER);
    gl.shaderSource(fs, fsSource);
    gl.compileShader(fs);

    const prog = gl.createProgram();
    gl.attachShader(prog, vs);
    gl.attachShader(prog, fs);
    gl.linkProgram(prog);
    gl.useProgram(prog);

    // Geometry
    const data = new Float32Array(count * 4);
    for (let i = 0; i < count; i++) {
      const y = 1.0 - 2.0 * (i + 0.5) / count;
      const r = Math.sqrt(Math.max(0.0, 1.0 - y * y));
      const phi = i * 2.399963229728653;
      data[i * 4 + 0] = r * Math.cos(phi);
      data[i * 4 + 1] = y;
      data[i * 4 + 2] = r * Math.sin(phi);
      data[i * 4 + 3] = i / count;
    }
    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);

    const aPos = gl.getAttribLocation(prog, 'a_pos');
    gl.enableVertexAttribArray(aPos);
    gl.vertexAttribPointer(aPos, 4, gl.FLOAT, false, 0, 0);

    const uTime = gl.getUniformLocation(prog, 'u_time');
    const uTab = gl.getUniformLocation(prog, 'u_tab');
    const uOpt = gl.getUniformLocation(prog, 'u_opt');
    const uAudio = gl.getUniformLocation(prog, 'u_audio');

    function resize() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = canvas.clientWidth * dpr;
      canvas.height = canvas.clientHeight * dpr;
      gl.viewport(0, 0, canvas.width, canvas.height);
    }
    window.addEventListener('resize', resize);
    setTimeout(resize, 50);

    let start = performance.now();
    function loop(now) {
      const t = (now - start) * 0.001;
      gl.clearColor(0, 0, 0, 0);
      gl.clear(gl.COLOR_BUFFER_BIT);
      gl.enable(gl.BLEND);
      gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

      const tabIdx = currentTab === 'thinking' ? 0 : (currentTab === 'speaking' ? 1 : 2);
      const optVal = selection[currentTab];

      gl.uniform1f(uTime, t);
      gl.uniform1i(uTab, tabIdx);
      gl.uniform1i(uOpt, optVal);
      gl.uniform1f(uAudio, audioVal);

      gl.drawArrays(gl.POINTS, 0, count);
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
