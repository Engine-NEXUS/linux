# NEXUS Server Stack — sidecar + n8n + Ollama
# Deploy with: docker compose up -d
#
# The sidecar and n8n are on the same network so n8n can call
# http://sidecar:8443/auth/github (localhost equivalent).
#
# Ollama is optional — if you already run it on the host, comment it out.

services:
  # ─── NEXUS Sidecar (credential handoff + WSS bridge) ───────────
  # ~35 MB RAM, text-only, no ML models
  sidecar:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus-sidecar
    restart: unless-stopped
    ports:
      - "8443:8443"
    env_file:
      - sidecar/.env
    volumes:
      # Persist the SQLite credential database across restarts
      - sidecar-data:/data
    networks:
      - nexus-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8443/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ─── n8n (workflow engine) ─────────────────────────────────────
  # n8n calls the sidecar at http://sidecar:8443/auth/{provider}
  # (Docker internal DNS — no need for localhost or IP addresses)
  n8n:
    image: n8nio/n8n:latest
    container_name: nexus-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://100.71.60.31:5678/
      - NEXUS_SIDECAR_URL=http://sidecar:8443
      # n8n can call the sidecar using Docker's internal DNS
      # In n8n HTTP Request nodes, use: http://sidecar:8443/auth/github
    volumes:
      - n8n-data:/home/node/.n8n
    networks:
      - nexus-net
    depends_on:
      sidecar:
        condition: service_healthy

  # ─── Ollama (local LLM) ────────────────────────────────────────
  # Uncomment if you want Ollama in the same stack.
  # Requires GPU — see https://github.com/ollama/ollama/blob/main/docs/docker.md
  #
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: nexus-ollama
  #   restart: unless-stopped
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama-data:/root/.ollama
  #   # For GPU support, add:
  #   # deploy:
  #   #   resources:
  #   #     reservations:
  #   #       devices:
  #   #         - driver: nvidia
  #   #           count: 1
  #   #           capabilities: [gpu]
  #   networks:
  #     - nexus-net

networks:
  nexus-net:
    driver: bridge

volumes:
  sidecar-data:
  n8n-data:
  # ollama-data:
