name = "nexus-worker"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# ---- Workers AI binding ----
# Free tier: 10K neurons/day. No API key needed.
[ai]
binding = "AI"

# ---- D1 Database binding ----
# Free tier: 5GB storage, 5M reads/day, 100K writes/day.
# Create the database first:
#   npx wrangler d1 create nexus-db
# Then paste the database_id below.
[[d1_databases]]
binding = "DB"
database_name = "nexus-db"
database_id = "4bca5d1b-55e1-4a30-bbf9-ca28cf96e3ea"

# ---- Environment variables (non-secret) ----
[vars]
# No non-secret vars needed. OAuth client IDs/secrets are set as secrets:
#   npx wrangler secret put GOOGLE_CLIENT_ID
#   npx wrangler secret put GOOGLE_CLIENT_SECRET
#   npx wrangler secret put GITHUB_CLIENT_ID
#   npx wrangler secret put GITHUB_CLIENT_SECRET

# ---- KV Namespace (edge caching) ----
# Create first: npx wrangler kv namespace create CACHE
# Then paste the id below.
[[kv_namespaces]]
binding = "CACHE"
id = "2af54bd3039040969e2ffac4c745e443"

# ---- R2 Bucket (NLU model distribution) ----
# Free tier: 10 GB storage, 10M reads/month.
# Create first:
#   npx wrangler r2 bucket create nexus-models
# Then uncomment the binding below and redeploy.
# Admin publishes via: python server/nlu/publish_nlu.py
# Also set: npx wrangler secret put NEXUS_ADMIN_TOKEN
# [[r2_buckets]]
# binding = "MODELS"
# bucket_name = "nexus-models"

# ---- Observability ----
[observability]
enabled = true
